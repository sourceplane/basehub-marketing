apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The BaseHub-powered marketing website, blog and changelog (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # No dependsOn: the site reads no wiring and binds nothing, so there is no
  # infra component to deploy before it.
  #
  # The BaseHub repository's read token: a value `next build` inlines into the
  # SERVER bundle (next.config.ts `env`) — every page is pre-rendered by the
  # build — stored per environment as the product's secret BASEHUB_TOKEN
  # (README → Connecting BaseHub). A BEST-EFFORT reference,
  # wire-now-seed-later: a key nobody has stored yet is skipped when the job
  # resolves its secrets (no env var, no failure), and a build without it is
  # the site with its bundled sample content and a "connect BaseHub" notice —
  # so a fresh product deploys and serves before its owner has a BaseHub
  # repository at all.
  optionalSecretEnv:
    BASEHUB_TOKEN: "secret://basehub-marketing/basehub-marketing/{{ .environment }}/BASEHUB_TOKEN"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: basehub-marketing-web-{dev,stage,prod}.
    workerName: basehub-marketing-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # The site's links, sitemap, robots and feeds are absolute, so each
    # build is for this environment's origin: NEXT_PUBLIC_SITE_URL (the
    # environment's SITE_URL in intent.yaml, else its workers.dev URL).
    buildCommand: NEXT_PUBLIC_SITE_URL="${SITE_URL:-https://basehub-marketing-web-${ORUN_ENVIRONMENT}.your-workers-subdomain.workers.dev}" pnpm exec turbo run build --filter=@app/web

    # Smoke: the home page renders the site's navigation (its link to the
    # blog — whether it is the sample content's header or the owner's, the
    # template's footer always links it), and the health check answers.
    # Pages are buffered before grep so an early match cannot SIGPIPE curl.
    smokeCommand: 'html=$(curl -sfL "${DEPLOYED_URL}/") && echo "${html}" | grep -q "href=\"/blog" && health=$(curl -sf "${DEPLOYED_URL}/api/health") && echo "${health}" | grep -q "\"ok\":true"'
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
